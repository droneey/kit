[tools]
betterleaks = "1.8.1"
bun = "1.4.2"
"github:droneey/constitution" = { version = "0.65.3", asset_pattern = "constitution.tar.gz", strip_components = 0 }
lefthook = "2.1.14"
ls-lint = "2.3.1"
osv-scanner = "2.6.0"
python = "3.14.8"
uv = "0.12.22"

[hooks]
postinstall = [
  "mkdir -p .droneey",
  "ln -sfn \"$(mise where github:droneey/constitution)\" .droneey/constitution",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true
